[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cugmec"
dynamic = ["version"]
description = "Prepare cuGMEC inputs and convert its outputs, with HDF5 as the user-facing format"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "h5py"]

[project.optional-dependencies]
desc = ["desc-opt~=0.17.0"]  # from-desc and from-geqdsk --method desc; the default method needs pyCOCOS

[project.scripts]
cugmec = "cugmec.cli:main"

[tool.setuptools]
packages = ["cugmec"]

[tool.setuptools.dynamic]
version = {attr = "cugmec.__version__"}
